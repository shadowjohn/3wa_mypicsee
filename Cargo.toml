[package]
name = "mypicsee"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "An offline desktop photo viewer"

[dependencies]
eframe = { version = "0.33.3", default-features = false, features = ["default_fonts", "glow", "x11"] }
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp", "gif", "tiff", "bmp"] }
rfd = "0.15"
kamadak-exif = "0.6.1"
rusqlite = { version = "0.37", features = ["bundled"] }

[features]
photo-webgl = ["dep:wry", "dep:sha2", "dep:ureq", "dep:httpdate"]

[target.'cfg(windows)'.dependencies]
wry = { version = "=0.57.3", default-features = false, optional = true }
sha2 = { version = "0.10", optional = true }
ureq = { version = "=3.5.2", default-features = false, features = ["rustls"], optional = true }
httpdate = { version = "1.0", optional = true }

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[profile.release]
strip = "symbols"
lto = "thin"
